<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrenchLog</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h3, h4 {
            margin-top: 0;
            color: #ffffff;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaa;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn:active {
            opacity: 0.8;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row > * {
            flex: 1;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .log-item {
            background: #282828;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #007bff;
        }
        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.7s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <h2>WrenchLog</h2>

    <!-- Vehicle Management Card -->
    <div class="card">
        <h3>Vehicle Management</h3>
        
        <label for="finder-vehicle-select">Active Vehicle:</label>
        <select id="finder-vehicle-select" onchange="updateActiveVehicle()">
            <!-- Dynamically populated -->
        </select>

        <div style="margin-top: 15px; border-top: 1px solid #444; padding-top: 12px;">
            <h4 style="margin: 0 0 8px 0; font-size: 14px; color: #aaa;">Add Custom Vehicle</h4>
            <div class="row">
                <input type="number" id="new-vehicle-year" placeholder="Year" />
                <input type="text" id="new-vehicle-make" placeholder="Make" />
                <input type="text" id="new-vehicle-model" placeholder="Model" />
            </div>
            <div class="row">
                <input type="text" id="new-vehicle-trim" placeholder="Trim (e.g. SV)" />
                <input type="text" id="new-vehicle-engine" placeholder="Engine (e.g. 4.0L V6)" />
            </div>
            <button class="btn" style="background: #28a745;" onclick="addNewVehicle()">Add & Select Vehicle</button>
        </div>
    </div>

    <!-- Part Finder Card -->
    <div class="card">
        <h3 id="current-vehicle-display" style="margin-top: 0;">No Vehicle Selected</h3>
        
        <label for="finder-keyword">Part / Keyword Search:</label>
        <input type="text" id="finder-keyword" placeholder="e.g. oil filter, spark plugs" oninput="runPartSearch()" />

        <div class="links-container">
            <a id="link-rockauto" href="https://www.rockauto.com" target="_blank" class="btn">Search RockAuto</a>
            <a id="link-amazon" href="https://www.amazon.com" target="_blank" class="btn" style="background: #ff9900; color: #000;">Search Amazon</a>
            <a id="link-ebay" href="https://www.ebay.com" target="_blank" class="btn" style="background: #e53238;">Search eBay</a>
        </div>
    </div>

    <!-- Service Log Entry Card -->
    <div class="card">
        <h3>Add Service Record</h3>
        <label for="service-date">Date:</label>
        <input type="date" id="service-date" />

        <label for="service-description">Work Performed / Notes:</label>
        <textarea id="service-description" rows="3" placeholder="e.g. Oil change, swapped spark plugs..."></textarea>

        <button class="btn" onclick="saveServiceRecord()">Save Service Record</button>
    </div>

    <!-- Service Log History Card -->
    <div class="card">
        <h3>Service Log History</h3>
        <div id="service-log-list">
            <p style="color: #888; font-size: 14px;">No service records logged yet.</p>
        </div>
        <button class="btn btn-danger" onclick="clearServiceLog()" style="margin-top: 12px;">Clear Vehicle Service Log</button>
    </div>

    <!-- Receipt History Card -->
    <div class="card">
        <h3>Receipt History</h3>
        
        <label for="receipt-file-input">Add New Receipt:</label>
        <input type="file" id="receipt-file-input" accept="image/*" onchange="saveNewReceipt(event)" />

        <div id="receipt-list" style="margin-top: 12px;">
            <p style="color: #888; font-size: 14px;">No receipts stored yet.</p>
        </div>
        
        <button class="btn btn-danger" onclick="clearReceiptHistory()" style="margin-top: 12px;">Clear Receipt History</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        // Load vehicles from localStorage
        function getStoredVehicles() {
            const saved = localStorage.getItem('wrenchlog_vehicles');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return {}; }
            }
            return {};
        }

        let vehicles = getStoredVehicles();

        function initVehicleDropdown(selectKey = null) {
            const select = document.getElementById('finder-vehicle-select');
            if (!select) return;
            select.innerHTML = '';
            
            const keys = Object.keys(vehicles);
            
            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "-- No Vehicles Added Yet --";
                select.appendChild(opt);
                const displayEl = document.getElementById('current-vehicle-display');
                if (displayEl) displayEl.innerText = "No Vehicle Selected";
                runPartSearch();
                loadServiceLog();
                return;
            }

            keys.forEach(key => {
                const v = vehicles[key];
                const opt = document.createElement('option');
                opt.value = key;
                let label = `${v.year} ${v.make} ${v.model}`;
                if (v.trim) label += ` ${v.trim}`;
                opt.innerText = label;
                select.appendChild(opt);
            });

            if (selectKey && vehicles[selectKey]) {
                select.value = selectKey;
            } else {
                select.value = keys[0];
            }
            updateActiveVehicle();
        }

        function addNewVehicle() {
            const yearInput = document.getElementById('new-vehicle-year');
            const makeInput = document.getElementById('new-vehicle-make');
            const modelInput = document.getElementById('new-vehicle-model');
            const trimInput = document.getElementById('new-vehicle-trim');
            const engineInput = document.getElementById('new-vehicle-engine');

            if (!yearInput || !makeInput || !modelInput) return;

            const year = yearInput.value.trim();
            const make = makeInput.value.trim();
            const model = modelInput.value.trim();
            const trim = trimInput ? trimInput.value.trim() : '';
            const engine = engineInput ? engineInput.value.trim() : '';

            if (!year || !make || !model) {
                showToast("Error", "Please fill in at least Year, Make, and Model.");
                return;
            }

            const newKey = 'vehicle_' + Date.now();
            vehicles[newKey] = { 
                year: parseInt(year), 
                make: make, 
                model: model, 
                trim: trim, 
                engine: engine 
            };
            
            localStorage.setItem('wrenchlog_vehicles', JSON.stringify(vehicles));

            yearInput.value = '';
            makeInput.value = '';
            modelInput.value = '';
            if (trimInput) trimInput.value = '';
            if (engineInput) engineInput.value = '';

            initVehicleDropdown(newKey);
            showToast("Success", "Vehicle added successfully!");
        }

        function updateActiveVehicle() {
            const selectEl = document.getElementById('finder-vehicle-select');
            const displayEl = document.getElementById('current-vehicle-display');
            if (!selectEl || !displayEl) return;

            const vehicleId = selectEl.value;
            const v = vehicles[vehicleId];
            
            if (v) {
                let fullDesc = `${v.year} ${v.make} ${v.model}`;
                if (v.trim) fullDesc += ` ${v.trim}`;
                if (v.engine) fullDesc += ` (${v.engine})`;
                displayEl.innerText = fullDesc;
            } else {
                displayEl.innerText = "No Vehicle Selected";
            }
            runPartSearch();
            loadServiceLog();
        }

        function runPartSearch() {
            const selectEl = document.getElementById('finder-vehicle-select');
            const keywordEl = document.getElementById('finder-keyword');
            const vehicleId = selectEl ? selectEl.value : '';
            const keyword = keywordEl ? keywordEl.value.trim() : '';
            const v = vehicles[vehicleId];

            let queryStr = keyword;
            if (v && keyword) {
                queryStr = `${v.year} ${v.make} ${v.model} ${v.trim || ''} ${keyword}`;
            } else if (v) {
                queryStr = `${v.year} ${v.make} ${v.model} ${v.trim || ''}`;
            }

            const encodedQuery = encodeURIComponent(queryStr);

            const rockAutoUrl = v ? `https://www.rockauto.com/en/catalog/${v.make.toLowerCase()},${v.year},${v.model.toLowerCase()}` : `https://www.rockauto.com`;
            const amazonUrl = `https://www.amazon.com/s?k=${encodedQuery}&tag=wrenchlog-20`;
            const ebayUrl = `https://www.ebay.com/sch/i.html?_nkw=${encodedQuery}`;

            const raLink = document.getElementById('link-rockauto');
            const amzLink = document.getElementById('link-amazon');
            const ebLink = document.getElementById('link-ebay');

            if (raLink) raLink.href = rockAutoUrl;
            if (amzLink) amzLink.href = amazonUrl;
            if (ebLink) ebLink.href = ebayUrl;
        }

        // Service Log Functions
        function saveServiceRecord() {
            const selectEl = document.getElementById('finder-vehicle-select');
            const vehicleId = selectEl ? selectEl.value : '';
            if (!vehicleId) {
                showToast("Error", "Please select or add a vehicle first.");
                return;
            }

            const date = document.getElementById('service-date').value;
            const desc = document.getElementById('service-description').value.trim();

            if (!date || !desc) {
                showToast("Error", "Please provide a date and service description.");
                return;
            }

            const storageKey = 'wrenchlog_service_' + vehicleId;
            let logs = [];
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved) logs = JSON.parse(saved);
            } catch (e) { logs = []; }

            logs.unshift({ date: date, description: desc });
            localStorage.setItem(storageKey, JSON.stringify(logs));

            document.getElementById('service-description').value = '';
            loadServiceLog();
            showToast("Success", "Service record saved.");
        }

        function loadServiceLog() {
            const selectEl = document.getElementById('finder-vehicle-select');
            const container = document.getElementById('service-log-list');
            if (!container) return;

            const vehicleId = selectEl ? selectEl.value : '';
            if (!vehicleId) {
                container.innerHTML = '<p style="color: #888; font-size: 14px;">No vehicle selected.</p>';
                return;
            }

            const storageKey = 'wrenchlog_service_' + vehicleId;
            let logs = [];
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved) logs = JSON.parse(saved);
            } catch (e) { logs = []; }

            if (logs.length === 0) {
                container.innerHTML = '<p style="color: #888; font-size: 14px;">No service records logged yet.</p>';
                return;
            }

            let html = '';
            logs.forEach(log => {
                html += `<div class="log-item"><strong>${log.date}</strong><br>${log.description}</div>`;
            });
            container.innerHTML = html;
        }

        function clearServiceLog() {
            const selectEl = document.getElementById('finder-vehicle-select');
            const vehicleId = selectEl ? selectEl.value : '';
            if (!vehicleId) return;

            if (!confirm("Are you sure you want to clear the service log for this vehicle? This cannot be undone.")) {
                return;
            }

            localStorage.removeItem('wrenchlog_service_' + vehicleId);
            loadServiceLog();
            showToast("Success", "Service log cleared.");
        }

        // Receipt History Functions
        function saveNewReceipt(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                const timestamp = new Date().toLocaleDateString();

                let receipts = [];
                try {
                    const saved = localStorage.getItem('wrenchlog_receipts');
                    if (saved) receipts = JSON.parse(saved);
                } catch (err) { receipts = []; }

                receipts.unshift({ date: timestamp, image: base64Data });
                localStorage.setItem('wrenchlog_receipts', JSON.stringify(receipts));

                event.target.value = '';
                loadReceiptHistory();
                showToast("Success", "Receipt saved successfully!");
            };
            reader.readAsDataURL(file);
        }

        function loadReceiptHistory() {
            const container = document.getElementById('receipt-list');
            if (!container) return;
            
            let receipts = [];
            try {
                const saved = localStorage.getItem('wrenchlog_receipts');
                if (saved) receipts = JSON.parse(saved);
            } catch (e) { receipts = []; }

            if (receipts.length === 0) {
                container.innerHTML = '<p style="color: #888; font-size: 14px;">No receipts stored yet.</p>';
                return;
            }

            let html = '';
            receipts.forEach(r => {
                html += `
                    <div style="background: #282828; padding: 10px; border-radius: 4px; margin-bottom: 8px;">
                        <strong style="font-size: 13px; color: #aaa;">Saved on: ${r.date}</strong><br>
                        <img src="${r.image}" style="max-width: 100%; border-radius: 4px; margin-top: 6px; cursor: pointer;" onclick="window.open('${r.image}')" alt="Receipt" />
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function clearReceiptHistory() {
            if (!confirm("Are you sure you want to clear your receipt history? This cannot be undone.")) {
                return;
            }
            localStorage.removeItem('wrenchlog_receipts');
            loadReceiptHistory();
            showToast("Success", "Receipt history cleared.");
        }

        function showToast(title, message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.innerText = `${title}: ${message}`;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Initial setup on load
        window.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('service-date');
            if (dateInput) dateInput.valueAsDate = new Date();
            initVehicleDropdown();
            loadReceiptHistory();
        });
    </script>
</body>
</html>
